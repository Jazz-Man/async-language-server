# Dylint configuration: library discovery + per-library config.
# Docs: https://github.com/trailofbits/dylint#workspace-metadata

[workspace.metadata.dylint]
libraries = [
    { path = "lints" },
    { git = "https://github.com/trailofbits/dylint", tag = "v6.0.4", pattern = [
        # `non_thread_safe_call_in_test` (dropped from v6.0.4 `general`): it
        # flags every `std::fs` call in tests (128 fires), but real temp
        # workspaces on disk are this crate's mandated test convention
        # (`testing.md`), already isolated by millisecond-unique directory
        # names — the fires are by design, so the lint is dropped, not
        # silenced.
        "examples/general/abs_home_path",
        "examples/general/await_holding_span_guard",
        "examples/general/basic_dead_store",
        "examples/general/crate_wide_allow",
        "examples/general/incorrect_matches_operation",
        "examples/general/non_local_effect_before_unhandled_error",
        "examples/general/wrong_serialize_struct_arg",
        "examples/supplementary",
        # `assert_eq_arg_misordering` (dropped, v6.0.4 restriction): it
        # demands const-first `assert_eq!` arguments (329 fires), against the
        # actual-first convention this codebase and the wider Rust ecosystem
        # follow.
        "examples/restriction/collapsible_unwrap",
        "examples/restriction/misleading_variable_name",
    ] },
]

# Per-library lint configuration: keyed by library name, then lint name.
[strict-lints.wire_boundary]
# The boundary sites: `src/error.rs` owns the single `From<ServerError>`
# conversion (and its `ResponseError::new` calls); `with_state` and the
# workspace-diagnostics layer are the protocol adapter paths. Everything else
# must speak domain errors.
allowed_paths = [
    "src/error.rs",
    "src/server/with_state/**",
    "src/workspace/diagnostics.rs",
]

[strict-lints.no_sync_io]
# The deliberate synchronous-IO sites — the same set arch-lint's no-sync-io
# rule blesses via `// arch-lint: allow` comments; both gates stay (arch-lint
# covers this repo in `cargo test`, this portable lint carries the rule to
# other projects):
# - `documents.rs`: notification handlers must stay synchronous per the LSP
#   spec; closing and fallbacks re-read files from disk.
# - `workspace.rs` + `walker.rs`: workspace scanning is a synchronous batch
#   pass over the ignore crate.
# - `with_state/mod.rs`: the dispatch fallback reads one file per request.
# - `oneshot/workspace_diagnostics.rs`: clientless batch file IO runs on the
#   blocking pool.
# - `benches/**`: bench setup runs before any async runtime exists.
allowed_paths = [
    "src/server/state/documents.rs",
    "src/server/state/workspace.rs",
    "src/workspace/walker.rs",
    "src/server/with_state/mod.rs",
    "src/oneshot/workspace_diagnostics.rs",
    "benches/**",
]
