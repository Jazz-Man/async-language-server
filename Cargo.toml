
[package]
name = "async-language-server"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
description = "A higher-level abstraction on top of async-lsp for building language servers with less boilerplate"
repository = "https://github.com/Jazz-Man/async-language-server"
readme = "README.md"
rust-version = "1.88"

[lib]
name = "async_language_server"
path = "src/lib.rs"

[features]
default = ["tracing", "tree-sitter"]
tracing = ["dep:tracing", "async-lsp/tracing"]
tree-sitter = ["dep:tree-sitter"]

[dependencies]
async-lsp = { version = "0.2.4", default-features = false, features = ["client-monitor", "omni-trait"] }
dashmap = "6.2.1"
futures = "0.3.34"
globset = "0.4.20"
ignore = "0.4.33"
ropey = "1.6.1"
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["io-std", "io-util", "net", "rt"] }
tower = "0.5.3"

tracing = { version = "0.1.44", optional = true }
tree-sitter = { version = "0.26.12", optional = true }

[dev-dependencies]
arch-lint = "0.5.0"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "macros"] }
tree-sitter-json = "0.24.8"

[[example]]
name = "tree_sitter"
required-features = ["tree-sitter"]

[lints.clippy]
all = { level = "deny", priority = -3 }
cargo = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -1 }

module_inception = { level = "allow", priority = 1 }
module_name_repetitions = { level = "allow", priority = 1 }
multiple_crate_versions = { level = "allow", priority = 1 }
similar_names = { level = "allow", priority = 1 }
unnecessary_wraps = { level = "allow", priority = 1 }

[lints.rust]
missing_docs = "warn"
