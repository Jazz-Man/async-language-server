[package]
name = "strict-lints"
version = "0.1.0"
edition = "2024"
publish = false
description = "Portable strictness lints shared across the owner's Rust projects"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
clippy_utils = { git = "https://github.com/rust-lang/rust-clippy", rev = "9fca3bc9fc2bc83c60bde26d18ed68f11564b228" }
dylint_linting = "6.0.4"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
dylint_testing = "6.0.4"

[workspace]

[lints.clippy]
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
option_if_let_else = "allow"

[lints.rust.unexpected_cfgs]
level = "deny"
check-cfg = ["cfg(dylint_lib, values(any()))"]

[package.metadata.rust-analyzer]
rustc_private = true
