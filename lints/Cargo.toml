[package]
name = "strict-lints"
version = "0.1.0"
edition = "2024"
publish = false
description = "Portable strictness lints shared across the owner's Rust projects"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
clippy_utils = { git = "https://github.com/rust-lang/rust-clippy", rev = "9fca3bc9fc2bc83c60bde26d18ed68f11564b228" }
# `constituent` keeps `impl_late_lint!` from emitting its own `dylint_library!`
# and `no_mangle register_lints` per lint — a multi-lint library declares them
# once at the crate root and delegates, like dylint's `examples/general`.
dylint_linting = { version = "6.0.4", features = ["constituent"] }
globset = "0.4"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# For the `ui/wire_boundary/` fixtures (`async_lsp::ResponseError`).
async-lsp = "0.2"
dylint_testing = "6.0.4"
# For the `ui/` fixture crates (`#[derive(thiserror::Error)]`) and the lint
# docs' doctests.
thiserror = "2"
# For the `ui/no_sleep_in_tests/bad_tokio.rs` fixture (`#[tokio::test]`,
# `tokio::time::sleep`).
tokio = { version = "1", features = ["macros", "rt", "time"] }

# UI fixtures: standalone crates compiled with the library loaded by the dylint
# driver. Registered as example targets so `dylint_testing` recovers their
# linking flags from a real cargo build and `thiserror` resolves.
[[example]]
name = "bad_case"
path = "ui/error_display/bad_case.rs"

[[example]]
name = "bad_punct"
path = "ui/error_display/bad_punct.rs"

[[example]]
name = "ok_lowercase"
path = "ui/error_display/ok_lowercase.rs"

[[example]]
name = "transparent_from"
path = "ui/error_display/transparent_from.rs"

[[example]]
name = "bad_tuple"
path = "ui/error_no_string/bad_tuple.rs"

[[example]]
name = "bad_named"
path = "ui/error_no_string/bad_named.rs"

[[example]]
name = "ok_two_fields"
path = "ui/error_no_string/ok_two_fields.rs"

[[example]]
name = "bad_plain"
path = "ui/require_thiserror/bad_plain.rs"

[[example]]
name = "ok_derived"
path = "ui/require_thiserror/ok_derived.rs"

[[example]]
name = "default_config_fires"
path = "ui/no_sync_io/default_config_fires.rs"

[[example]]
name = "ok_async_alt"
path = "ui/no_sync_io/ok_async_alt.rs"

[[example]]
name = "bad_construct"
path = "ui/wire_boundary/bad_construct.rs"

[[example]]
name = "bad_from_impl"
path = "ui/wire_boundary/bad_from_impl.rs"

[[example]]
name = "ok_read"
path = "ui/wire_boundary/ok_read.rs"

[[example]]
name = "noop_without_dep"
path = "ui/wire_boundary/noop_without_dep.rs"

[[example]]
name = "bad_pub_fn"
path = "ui/bool_params_public/bad_pub_fn.rs"

[[example]]
name = "ok_trait_impl"
path = "ui/bool_params_public/ok_trait_impl.rs"

[[example]]
name = "bad_thread"
path = "ui/no_sleep_in_tests/bad_thread.rs"

[[example]]
name = "bad_tokio"
path = "ui/no_sleep_in_tests/bad_tokio.rs"

[[example]]
name = "ok_outside_test"
path = "ui/no_sleep_in_tests/ok_outside_test.rs"

[[example]]
name = "bad_doc"
path = "ui/panics_doc_debt/bad_doc.rs"

[workspace]

[lints.clippy]
nursery = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
option_if_let_else = "allow"

[lints.rust.unexpected_cfgs]
level = "deny"
check-cfg = ["cfg(dylint_lib, values(any()))"]

[package.metadata.rust-analyzer]
rustc_private = true
