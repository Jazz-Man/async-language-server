# arch-lint declarative layer rules (scopes + deny-scope-dep).
# Real documentation: https://github.com/ynishi/arch-lint
#
# The rule set itself is wired programmatically in tests/architecture.rs:
# through check!() the preset picks hardcoded defaults and every [rules.*]
# behavior option (allow_patterns, allow_in_tests, thresholds) is parsed but
# never consulted. Only the [[scopes]] / [[deny-scope-dep]] sections below
# are loaded, by load_rules_from_toml in the test.
#
# Per-item suppressions in src/ use the comment form (arch-lint is a
# dev-dependency, so its attribute form cannot compile inside the lib):
#   // arch-lint: allow(rule-name) reason="why this is deliberate"

# --- Layer rules mirroring .claude/rules/structure.md -------------------------
# The dependency direction: text_utils is the bottom leaf; documents,
# lsp_requests, and workspace are siblings below the server wiring; oneshot is
# the top-level clientless consumer. Siblings never import each other, with
# one blessed reuse edge: workspace -> lsp_requests (encoding conversion for
# workspace reports). The domains' imports of crate::server facade types are
# the designed route to shared types and stay allowed. The lsp_macros
# proc-macro crate stands outside the layer stack: it generates library code
# and must not depend on the library it serves.

[[scopes]]
name = "text-utils"
paths = ["src/text_utils/**"]

[[scopes]]
name = "documents"
paths = ["src/documents/**"]

[[scopes]]
name = "workspace"
paths = ["src/workspace/**"]

[[scopes]]
name = "lsp-requests"
paths = ["src/lsp_requests/**"]

[[scopes]]
name = "server"
paths = ["src/server/**"]

[[scopes]]
name = "oneshot"
paths = ["src/oneshot/**"]

# A separate workspace member, not a src module: scope names are kebab-case
# identifiers (arch-lint allows [a-z0-9-] only), the paths glob is what ties
# a scope to the code.
[[scopes]]
name = "lsp-macros"
paths = ["macros/src/**"]

[[deny-scope-dep]]
name = "text-utils-is-leaf"
from = "text-utils"
to = ["documents", "lsp-requests", "workspace", "server", "oneshot"]
message = "text_utils is a leaf; conversion machinery must not leak into it."

[[deny-scope-dep]]
name = "documents-stays-below-wiring"
from = "documents"
to = ["lsp-requests", "workspace", "oneshot"]
message = "documents must not depend on request handling, workspace scanning, or the clientless entry point."

[[deny-scope-dep]]
name = "lsp-requests-stays-below-wiring"
from = "lsp-requests"
to = ["documents", "workspace", "oneshot"]
message = "encoding conversion must not reach into sibling domains or the clientless entry point."

[[deny-scope-dep]]
name = "lsp-macros-is-standalone"
from = "lsp-macros"
to = ["text-utils", "documents", "lsp-requests", "workspace", "server", "oneshot"]
message = "the proc-macro crate generates library code but must not depend on the library it serves."

[[deny-scope-dep]]
name = "workspace-stays-below-wiring"
from = "workspace"
to = ["documents", "oneshot"]
message = "workspace scanning stays below the document store and the clientless entry point."

[[deny-scope-dep]]
name = "server-above-domains"
from = "server"
to = ["oneshot"]
message = "server plumbing must not depend on the clientless oneshot entry point."
