name: Rust setup
description: Cargo build caching (Swatinem/rust-cache, pinned; cache saves on main only). Call only after actions/checkout — local actions resolve from the workspace.

runs:
  using: composite
  steps:
    - name: Cache cargo build
      uses: Swatinem/rust-cache@v2.9.2
      with:
        save-if: ${{ github.ref == 'refs/heads/main' }}
